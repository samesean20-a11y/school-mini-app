<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្មវិធីសាលារៀន</title>
    <!-- បញ្ចូល Telegram Web App SDK ដើម្បីឱ្យវាស្គាល់ Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Khmer OS Siemreap', Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 50px;
        }
        button {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>សួស្ដី! សាលាបឋមសិក្សាហ៊ុនសែនមិត្តភាព</h2>
        <p>សូមស្វាគមន៍មកកាន់ Telegram Mini App របស់យើង។</p>
        <button onclick="sayHello()">ចុចទីនេះ</button>
    </div>

    <script>
        // កូដ JavaScript ដើម្បីឱ្យ Telegram បង្ហាញសារពេលចុចប៊ូតុង
        let tg = window.Telegram.WebApp;
        tg.expand(); // ពង្រីកទំព័រឱ្យពេញអេក្រង់

        function sayHello() {
            alert("អរគុណសម្រាប់ការសាកល្បង Telegram Mini App!");
        }
    </script>

</body>
</html>
